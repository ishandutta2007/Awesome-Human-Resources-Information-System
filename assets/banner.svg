<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glowing Circle Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Animated Background Elements -->
  <g opacity="0.3">
    <circle cx="200" cy="100" r="40" fill="none" stroke="#38bdf8" stroke-width="2">
      <animate attributeName="r" values="40;50;40" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1000" cy="300" r="60" fill="none" stroke="#818cf8" stroke-width="2">
      <animate attributeName="r" values="60;70;60" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Central Title Text -->
  <text x="600" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="url(#textGrad)" text-anchor="middle" filter="url(#glow)">Awesome HRIS</text>
  
  <text x="600" y="260" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" fill="#94a3b8" text-anchor="middle">Top Human Resource Information Systems, Payroll, &amp; SaaS Solutions</text>

  <!-- Animated Floating Data Nodes -->
  <g fill="#38bdf8">
    <circle cx="450" cy="320" r="6">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-15; 0,0" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="550" cy="340" r="8">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-20; 0,0" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="650" cy="340" r="8">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-25; 0,0" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="750" cy="320" r="6">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="4.5s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
